<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — prototypesandprogramming</title>
  <meta name="description" content="Robotics, machine learning, and fabrication projects by Nathanael Oliver." />
  <link rel="icon" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="projects">
  <div id="site-nav"></div>

  <div class="page-hero">
    <div class="container">
      <span class="section-tag">Things I've built</span>
      <h1>Projects</h1>
      <p>Robotics, machine learning, CAD, and whatever else I've been tinkering with lately.</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="grid" id="projectsGrid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/nav.js"></script>
  <script src="js/projects-data.js"></script>
  <script>
    const grid = document.getElementById("projectsGrid");
    grid.innerHTML = window.PROJECTS.map(
      (p) => `
      <div class="card">
        <div class="card-bar"></div>
        ${p.image ? `<div class="card-media"><img src="${p.image}" alt="${p.title}" loading="lazy"></div>` : ""}
        <h3>${p.title}</h3>
        <p class="desc">${p.description}</p>
        <div class="tag-row">${p.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
        ${
          p.link
            ? `<div class="card-links"><a href="${p.link}" target="_blank" rel="noopener noreferrer">${p.linkLabel || "Learn more"}</a></div>`
            : ""
        }
      </div>`
    ).join("");
  </script>
</body>
</html>
